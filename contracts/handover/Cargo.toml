[package]
name = "handover"
version = "0.1.0"
edition = "2021"
description = "Handover: an NFT that owns its own Ethereum wallet (NEAR Chain Signatures) and a sale flow that makes the wallet safely sellable."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `unstable` only exposes env::ecrecover (a stable host function) used to verify MPC signatures.
near-sdk = { version = "5.30.0", features = ["unstable"] }
near-contract-standards = "5.30.0"
omni-transaction = { version = "0.5.0", default-features = false, features = ["evm"] }
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing", "unstable"] }
# Test-only: sign with a known throwaway key and decode the assembled raw tx.
k256 = { version = "0.13", features = ["ecdsa"] }
rlp = "0.6.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
