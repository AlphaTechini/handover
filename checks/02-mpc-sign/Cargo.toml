[package]
name = "mpc_sign_probe"
version = "0.1.0"
edition = "2024"
description = "Capability check 2: a minimal contract that asks the NEAR MPC signer for a secp256k1 signature over an EIP-1559 payload."

[dependencies]
near-contract-standards = "5.30.0"
near-sdk = "5.30.0"
omni-transaction = { version = "0.5.0", default-features = false, features = ["evm"] }

hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
